    spdx: Apache-2.0
    ship_ok: true
    provenance: >-
      Roboflow release; pretraining includes Objects365-derived pseudo-labels
      (documented by upstream).
    notes: Expects RGB input; Panoptes detect backend converts from BGR.
  - id: rf-detr-large
    family: rf-detr
    task: vehicle-detection
    source: https://github.com/roboflow/rf-detr
    spdx: Apache-2.0
    ship_ok: true
