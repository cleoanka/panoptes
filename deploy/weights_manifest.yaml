    notes: Expects RGB input; Panoptes detect backend converts from BGR.
  # XL/2XL tiers are Platform Model License 1.0 — NOT redistributable.
  - id: rf-detr-xl
    family: rf-detr
    task: vehicle-detection
    source: https://github.com/roboflow/rf-detr
    spdx: LicenseRef-PML-1.0
    ship_ok: false
    provenance: Roboflow release under the Platform Model License.
    notes: Do not download, bundle, or fine-tune for commercial builds.
  - id: rf-detr-2xl
    family: rf-detr
    task: vehicle-detection
    source: https://github.com/roboflow/rf-detr
