  # ------------------------------------------------------------ RF-DETR ----
  # Apache-2.0 code AND weights for the Nano..Large tier — the license-clean
  # default detector for sellable builds.
  - id: rf-detr-nano
    family: rf-detr
    task: vehicle-detection
    source: https://github.com/roboflow/rf-detr
    spdx: Apache-2.0
    ship_ok: true
    provenance: >-
      Roboflow release; pretraining includes Objects365-derived pseudo-labels
      (documented by upstream). COCO AP 48.4.
    notes: Expects RGB input; Panoptes detect backend converts from BGR.
  - id: rf-detr-small
    family: rf-detr
    task: vehicle-detection
    source: https://github.com/roboflow/rf-detr
    spdx: Apache-2.0
    ship_ok: true
    provenance: >-
      Roboflow release; pretraining includes Objects365-derived pseudo-labels
      (documented by upstream).
    notes: Expects RGB input; Panoptes detect backend converts from BGR.
  - id: rf-detr-medium
    family: rf-detr
    task: vehicle-detection
