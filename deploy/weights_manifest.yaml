# ---------------------------------------------------------------------------
# Panoptes weights provenance manifest.
#
# Every model artifact that can end up inside a shipped image or customer
# deliverable is declared here with its SPDX license and a ship_ok verdict:
#
#   ship_ok: true    redistributable in commercial builds as-is
#   ship_ok: false   NOT redistributable (license blocks it) — see notes
#   ship_ok: review  package license is clean but weight provenance carries
#                    risk; legal review before bundling in a paid deliverable
#
# CI cross-checks this file against the built image; docs/LICENSING.md holds
# the long-form rationale. Facts verified 2026-07-12.
# ---------------------------------------------------------------------------

manifest_version: 1
updated: "2026-07-12"

weights:
  # ------------------------------------------------------------- YOLO26 ----
  # AGPL-3.0 applies to the ultralytics package AND its released weights,
  # including fine-tunes. ship_ok flips to true only under an Ultralytics
  # Enterprise License (record the contract id in `notes` when purchased).
  - id: yolo26n
    family: yolo26
    task: vehicle-detection
    file: yolo26n.pt
    source: https://github.com/ultralytics/assets/releases/tag/v8.4.0
    spdx: AGPL-3.0-only
    ship_ok: false
    provenance: Ultralytics official release, trained on COCO (mAP 40.9).
    notes: Optional [yolo] extra only; network clause applies to hosted use.
