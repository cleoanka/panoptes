  # --------------------------------------------------------------- ALPR ----
  - id: fast-plate-ocr-cct-s-v2-global
    family: fast-plate-ocr
    task: plate-ocr
    file: cct-s-v2-global-model
    source: https://github.com/ankandrew/fast-plate-ocr
    spdx: MIT
    ship_ok: true
    provenance: >-
      fast-plate-ocr 1.1.0 official model, 65-country region head; validated
      on Turkish plates (97.8% plate / 99.63% char accuracy).
    notes: Default OCR model of the [alpr] extra.
  - id: open-image-models-yolo-v9-s-608-license-plate-end2end
    family: open-image-models
    task: plate-detection
    file: yolo-v9-s-608-license-plate-end2end
    source: https://github.com/ankandrew/open-image-models
    spdx: MIT
    ship_ok: review
    provenance_risk: >-
      Package and weight files are published under MIT, but the architecture
      lineage is YOLOv9 whose upstream training code is GPL-3.0 — weight
      provenance is not fully clean-room. Legal review before bundling in a
      paid deliverable; a custom plate-detector hook is provided as fallback.
    notes: Default plate detector of the [alpr] extra (yolo-v9-t/s variants alike).

  # ---------------------------------------------------- Apache fallback ----
  - id: dfine-l-coco
    family: d-fine
    task: vehicle-detection
    source: https://huggingface.co/ustc-community/dfine_l_coco
    spdx: Apache-2.0
    ship_ok: true
    provenance: >-
      D-FINE COCO checkpoint served via transformers (DFineForObjectDetection).
      Fully Apache alternative when RF-DETR does not fit.
    notes: Do NOT use the obj2coco variants — Objects365 terms are academic-only.
