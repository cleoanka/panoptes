# Prometheus 3.x scrape config for the compose stack.
# Mounted at /etc/prometheus by deploy/docker-compose.yml.

global:
  scrape_interval: 15s
  evaluation_interval: 30s

scrape_configs:
  # Panoptes exposes Prometheus text metrics at /metrics (no auth required
  # for the metrics endpoint). 5s keeps FPS/latency panels responsive.
  - job_name: panoptes
    scrape_interval: 5s
    metrics_path: /metrics
    static_configs:
      - targets: ["panoptes:8080"]

  # Prometheus self-scrape.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
