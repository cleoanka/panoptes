# Grafana file-provisioned dashboards (Grafana 12.x, apiVersion 1).
# JSON files live in deploy/grafana/dashboards, mounted read-only at
# /var/lib/grafana/dashboards by deploy/docker-compose.yml.
apiVersion: 1

providers:
  - name: panoptes
    orgId: 1
    folder: Panoptes
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
