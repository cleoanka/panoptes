# Grafana file-provisioned datasource (Grafana 12.x, apiVersion 1).
apiVersion: 1

datasources:
  - name: Prometheus
    uid: panoptes-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      # Matches the panoptes job scrape_interval so rate() windows behave.
      timeInterval: 5s
      httpMethod: POST
