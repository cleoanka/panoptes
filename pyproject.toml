[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "panoptes"
version = "0.1.0"
description = "Production-grade road & vehicle intelligence platform: detection, tracking, ALPR, speed, and a declarative traffic-rules engine."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "cleoanka" }]
keywords = ["computer-vision", "vehicle-detection", "alpr", "traffic-analytics", "yolo", "tracking"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Image Recognition",
]

dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.10",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "sqlalchemy[asyncio]>=2.0.30",
  "aiosqlite>=0.20",
  "alembic>=1.13",
  "httpx>=0.27",
  "typer>=0.12",
  "structlog>=24.1",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
# Flagship detector backend. NOTE: ultralytics is AGPL-3.0 — for commercial
# distribution buy an Ultralytics Enterprise License or use the rfdetr extra.
yolo = ["ultralytics>=8.3.170"]
# Apache-2.0 licensed detector backend (commercially unencumbered).
# NOTE: only the Nano..Large weight tiers are Apache-2.0; XL/2XL are PML-1.0.
rfdetr = ["rfdetr>=1.8"]
# ONNX Runtime backend (CPU by default; install onnxruntime-gpu on CUDA servers).
onnx = ["onnxruntime>=1.20"]
# License plate recognition stack (MIT-licensed packages; see docs/LICENSING.md
# for the provenance note on the bundled plate-detector weights).
alpr = ["fast-plate-ocr[onnx]>=1.1", "open-image-models>=0.5"]
# RTSP/video ingest via PyAV (robust reconnect, precise PTS).
# NOTE: PyAV wheels bundle GPL x264/x265 — see docs/LICENSING.md before
# redistributing images that include this extra.
av = ["av>=14.0"]
postgres = ["asyncpg>=0.29"]
gpu-monitor = ["nvidia-ml-py>=12.0"]
train = ["ultralytics>=8.3.170", "roboflow>=1.1"]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
]
# Convenience bundle for the license-clean, commercially-distributable
# build. It deliberately EXCLUDES the copyleft-encumbered opt-ins: 'yolo'
# (ultralytics, AGPL-3.0) and 'av' (PyAV wheels bundle GPL x264/x265).
# Install those explicitly — e.g. `.[yolo,alpr]` for the flagship YOLO26
# path — only when you accept their terms (see docs/LICENSING.md).
all = ["panoptes[rfdetr,onnx,alpr,postgres,gpu-monitor]"]

[project.scripts]
panoptes = "panoptes.cli:app"

[project.urls]
Homepage = "https://github.com/cleoanka/panoptes"
Documentation = "https://github.com/cleoanka/panoptes/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/panoptes"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "B008", "SIM108", "RUF012"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
# Match the actual .venv interpreter: numpy's 3.12 stubs use `type` statements
# that mypy cannot parse under an older target (it aborts before checking).
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
