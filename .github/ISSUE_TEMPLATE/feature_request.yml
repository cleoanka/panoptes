name: Feature request
description: Suggest an enhancement to Panoptes
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do that Panoptes makes hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like Panoptes to do? Sketch the config, API or CLI surface if relevant.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you evaluated and why they fall short.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Detection / backends
        - Tracking
        - Speed / motion
        - Analytics / rules
        - ALPR
        - API / dashboard
        - Storage / retention
        - Deployment / observability
        - Docs
        - Other
    validations:
      required: true
  - type: checkboxes
    id: licensing
    attributes:
      label: Licensing
      options:
        - label: This request does not require adding an AGPL/GPL-3.0/SSPL runtime dependency to the base install (see docs/LICENSING.md).
